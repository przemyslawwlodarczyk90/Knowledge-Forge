# ===============================
# APP -- czysta Java, embedded Jetty, bez Springa
# ===============================
server.port=8081

# ===============================
# DATABASE - POSTGRES (JDBC + HikariCP, bez Hibernate)
# ===============================
db.url=jdbc:postgresql://localhost:5432/pgDB
db.username=user
db.password=password

# ===============================
# CORS / BASE URL
# ===============================
cors.allowed-origin=http://localhost:3000

# ===============================
# DEFAULT USER (aplikacja dziala bez logowania)
# ===============================
default-user.username=default
default-user.email=default@knowledge-forge.local

# ===============================
# PRZECHOWYWANIE NOTATEK
# ===============================
# Baza danych trzyma tylko sciezki do plikow -- same notatki (.kfdoc) i PDF-y
# leza na dysku pod ta sciezka. Wzgledna sciezka liczy sie od katalogu, z ktorego
# odpalono "java -jar" (nadpisz przez NOTES_STORAGE_PATH przy innym wdrozeniu).
notes.storage.path=./data/notes

# ===============================
# LOGOWANIE
# ===============================
# Szczegolowe logi (FINE) z pakietu aplikacji -- wylacz w prod: DEBUG_LOGGING=false
debug.logging=true

# ===============================
# ZALACZNIKI
# ===============================
# Baza trzyma tylko metadane + wzgledna sciezke -- same pliki leza na dysku pod ta sciezka.
attachments.storage.path=./data/attachments
attachments.max-file-size-mb=100

# ===============================
# BACKUP BAZY POSTGRESQL (pg_dump -Fc) -- NIE obejmuje plikow z attachments.storage.path
# ===============================
backup.enabled=true
backup.directory=./data/database-backups
backup.retention-days=14
backup.schedule-hour=2
backup.schedule-minute=0
backup.pg-dump-path=pg_dump
backup.pg-restore-path=pg_restore

# ===============================
# WERYFIKACJA AKTUALNOSCI NOTATEK (zob. dokumentacja/ACTUALITY_VERIFICATION.txt)
# ===============================
# Okresowo (wg crona ponizej) oznacza tematy, ktorych nikt nie potwierdzil/nie edytowal od
# dluzej niz ten okres, jako wymagajace ponownego sprawdzenia (actualityVerified=false).
actuality.verification.enabled=true
# Okres waznosci -- zapis zgodny z java.time.Period (np. P2Y = 2 lata, P6M = 6 miesiecy).
actuality.verification.period=P2Y
# Harmonogram kontroli -- pieciopolowy cron (minuta godzina dzien-miesiaca miesiac dzien-tygodnia).
# Przyklad: "0 17 * * 5" = kazdy piatek o 17:00.
actuality.verification.cron=0 17 * * 5
# Strefa czasowa, w ktorej liczone jest zarowno uruchomienie crona, jak i sam okres waznosci --
# jawna i niezalezna od strefy skonfigurowanej na serwerze/w OS.
actuality.verification.zone-id=Europe/Warsaw

# ===============================
# CODZIENNY ZBIORCZY BACKUP NOTATEK/INSTRUKCJI (.kfbundle) -- zob. dokumentacja/BACKUP_STRATEGY.txt
# ===============================
# Skanuje notes.storage.path BEZPOSREDNIO Z DYSKU (nie tabele note) i buduje JEDEN, stale
# nadpisywany plik knowledge-forge-notes-latest.kfbundle -- bez historii, bez retencji. Niezalezny
# od stanu bazy: dziala nawet przy pustej/uszkodzonej bazie, bo czyta wylacznie pliki .kfdoc.
note-bundle-backup.enabled=true
# Katalog na dysku (SCIEZKA SYSTEMOWA, nie URL) -- celowo INNY niz notes.storage.path (walidowane
# przy starcie). Najlepsza ochrona: osobny wolumen/udzial sieciowy, nie ten sam dysk co baza/.kfdoc.
note-bundle-backup.directory=./data/note-bundle-backups
# Harmonogram -- pieciopolowy cron. Domyslnie "30 17 * * *" = codziennie o 17:30.
note-bundle-backup.cron=30 17 * * *
# Strefa czasowa harmonogramu -- jawna, niezalezna od strefy serwera/OS.
note-bundle-backup.zone-id=Europe/Warsaw

# ===============================
# ADMINISTRACYJNY ENDPOINT RESTORE -- domyslnie wylaczony i zablokowany
# ===============================
# Zob. dokumentacja/BACKUP_AND_RESTORE.txt. Wlacz swiadomie tylko lokalnie/administracyjnie:
#   BACKUP_RESTORE_ENABLED=true
# NIE wpisuj tu prawdziwego sekretu -- backup.restore.secret ma zostac puste w repozytorium.
# Produkcyjny sekret pochodzi WYLACZNIE ze zmiennej srodowiskowej BACKUP_RESTORE_SECRET.
# Pusty sekret (tak jak tutaj) calkowicie blokuje endpoint, niezaleznie od backup.restore.enabled.
backup.restore.enabled=false
backup.restore.secret=
