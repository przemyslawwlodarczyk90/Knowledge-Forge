# ===============================
# APP — czysta Java, embedded Jetty, bez Springa
# ===============================
server.port=8081

# ===============================
# DATABASE - POSTGRES (JDBC + HikariCP, bez Hibernate)
# ===============================
db.url=jdbc:postgresql://localhost:5432/pgDB
db.username=user
db.password=password

# ===============================
# CORS / BASE URL
# ===============================
cors.allowed-origin=http://localhost:3000

# ===============================
# DEFAULT USER (aplikacja działa bez logowania)
# ===============================
default-user.username=default
default-user.email=default@knowledge-forge.local

# ===============================
# PRZECHOWYWANIE NOTATEK
# ===============================
# Baza danych trzyma tylko ścieżki do plików — same notatki (.kfdoc) i PDF-y
# leżą na dysku pod tą ścieżką. Względna ścieżka liczy się od katalogu, z którego
# odpalono "java -jar" (nadpisz przez NOTES_STORAGE_PATH przy innym wdrożeniu).
notes.storage.path=./data/notes

# ===============================
# LOGOWANIE
# ===============================
# Szczegółowe logi (FINE) z pakietu aplikacji — wyłącz w prod: DEBUG_LOGGING=false
debug.logging=true

# ===============================
# ZAŁĄCZNIKI
# ===============================
# Baza trzyma tylko metadane + względną ścieżkę — same pliki leżą na dysku pod tą ścieżką.
attachments.storage.path=./data/attachments
attachments.max-file-size-mb=100

# ===============================
# BACKUP BAZY POSTGRESQL (pg_dump -Fc) — NIE obejmuje plików z attachments.storage.path
# ===============================
backup.enabled=true
backup.directory=./data/database-backups
backup.retention-days=14
backup.schedule-hour=2
backup.schedule-minute=0
backup.pg-dump-path=pg_dump
backup.pg-restore-path=pg_restore

# ===============================
# ADMINISTRACYJNY ENDPOINT RESTORE — domyślnie wyłączony i zablokowany
# ===============================
# Zob. BACKUP_AND_RESTORE.txt. Włącz świadomie tylko lokalnie/administracyjnie:
#   BACKUP_RESTORE_ENABLED=true
# NIE wpisuj tu prawdziwego sekretu — backup.restore.secret ma zostać puste w repozytorium.
# Produkcyjny sekret pochodzi WYŁĄCZNIE ze zmiennej środowiskowej BACKUP_RESTORE_SECRET.
# Pusty sekret (tak jak tutaj) całkowicie blokuje endpoint, niezależnie od backup.restore.enabled.
backup.restore.enabled=false
backup.restore.secret=
