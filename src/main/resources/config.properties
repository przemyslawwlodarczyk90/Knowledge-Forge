# ===============================
# APP — czysta Java, embedded Jetty, bez Springa
# ===============================
server.port=8081

# ===============================
# DATABASE - POSTGRES (JDBC + HikariCP, bez Hibernate)
# ===============================
db.url=jdbc:postgresql://localhost:5432/pgDB
db.username=user
db.password=password

# ===============================
# CORS / BASE URL
# ===============================
cors.allowed-origin=http://localhost:3000

# ===============================
# DEFAULT USER (aplikacja działa bez logowania)
# ===============================
default-user.username=default
default-user.email=default@knowledge-forge.local

# ===============================
# PRZECHOWYWANIE NOTATEK
# ===============================
# Baza danych trzyma tylko ścieżki do plików — same notatki (.kfdoc) i PDF-y
# leżą na dysku pod tą ścieżką. Względna ścieżka liczy się od katalogu, z którego
# odpalono "java -jar" (nadpisz przez NOTES_STORAGE_PATH przy innym wdrożeniu).
notes.storage.path=./data/notes

# ===============================
# LOGOWANIE
# ===============================
# Szczegółowe logi (FINE) z pakietu aplikacji — wyłącz w prod: DEBUG_LOGGING=false
debug.logging=true

# ===============================
# ZAŁĄCZNIKI
# ===============================
# Baza trzyma tylko metadane + względną ścieżkę — same pliki leżą na dysku pod tą ścieżką.
attachments.storage.path=./data/attachments
attachments.max-file-size-mb=100

# ===============================
# BACKUP BAZY POSTGRESQL (pg_dump -Fc) — NIE obejmuje plików z attachments.storage.path
# ===============================
backup.enabled=true
backup.directory=./data/database-backups
backup.retention-days=14
backup.schedule-hour=2
backup.schedule-minute=0
backup.pg-dump-path=pg_dump
backup.pg-restore-path=pg_restore

# ===============================
# WERYFIKACJA AKTUALNOŚCI NOTATEK (zob. dokumentacja/ACTUALITY_VERIFICATION.txt)
# ===============================
# Okresowo (wg crona poniżej) oznacza tematy, których nikt nie potwierdził/nie edytował od
# dłużej niż ten okres, jako wymagające ponownego sprawdzenia (actualityVerified=false).
actuality.verification.enabled=true
# Okres ważności — zapis zgodny z java.time.Period (np. P2Y = 2 lata, P6M = 6 miesięcy).
actuality.verification.period=P2Y
# Harmonogram kontroli — pięciopolowy cron (minuta godzina dzień-miesiąca miesiąc dzień-tygodnia).
# Przykład: "0 17 * * 5" = każdy piątek o 17:00.
actuality.verification.cron=0 17 * * 5
# Strefa czasowa, w której liczone jest zarówno uruchomienie crona, jak i sam okres ważności —
# jawna i niezależna od strefy skonfigurowanej na serwerze/w OS.
actuality.verification.zone-id=Europe/Warsaw

# ===============================
# CODZIENNY ZBIORCZY BACKUP NOTATEK/INSTRUKCJI (.kfbundle) — zob. dokumentacja/BACKUP_STRATEGY.txt
# ===============================
# Skanuje notes.storage.path BEZPOŚREDNIO Z DYSKU (nie tabelę note) i buduje JEDEN, stale
# nadpisywany plik knowledge-forge-notes-latest.kfbundle — bez historii, bez retencji. Niezależny
# od stanu bazy: działa nawet przy pustej/uszkodzonej bazie, bo czyta wyłącznie pliki .kfdoc.
note-bundle-backup.enabled=true
# Katalog na dysku (ŚCIEŻKA SYSTEMOWA, nie URL) — celowo INNY niż notes.storage.path (walidowane
# przy starcie). Najlepsza ochrona: osobny wolumen/udział sieciowy, nie ten sam dysk co baza/.kfdoc.
note-bundle-backup.directory=./data/note-bundle-backups
# Harmonogram — pięciopolowy cron. Domyślnie "30 17 * * *" = codziennie o 17:30.
note-bundle-backup.cron=30 17 * * *
# Strefa czasowa harmonogramu — jawna, niezależna od strefy serwera/OS.
note-bundle-backup.zone-id=Europe/Warsaw

# ===============================
# ADMINISTRACYJNY ENDPOINT RESTORE — domyślnie wyłączony i zablokowany
# ===============================
# Zob. dokumentacja/BACKUP_AND_RESTORE.txt. Włącz świadomie tylko lokalnie/administracyjnie:
#   BACKUP_RESTORE_ENABLED=true
# NIE wpisuj tu prawdziwego sekretu — backup.restore.secret ma zostać puste w repozytorium.
# Produkcyjny sekret pochodzi WYŁĄCZNIE ze zmiennej środowiskowej BACKUP_RESTORE_SECRET.
# Pusty sekret (tak jak tutaj) całkowicie blokuje endpoint, niezależnie od backup.restore.enabled.
backup.restore.enabled=false
backup.restore.secret=
