# =====================================================================================
# Knowledge Forge -- WYLACZNIE placeholdery. Wszystkie wartosci leza w pliku .env w katalogu
# projektu (wzor: .env.example). Zmienna srodowiskowa systemu nadpisuje wartosc z .env.
# Brak zmiennej = aplikacja nie wystartuje i powie, ktorej brakuje.
# =====================================================================================
spring.config.import=optional:file:./.env[.properties]

spring.application.name=Knowledge-Forge
server.port=${SERVER_PORT}

# ── Baza danych ─────────────────────────────────────────────────────────────────────
db.url=${DB_URL}
db.username=${DB_USERNAME}
db.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE}

# ── CORS / adres frontendu (link aktywacyjny w mailu) ───────────────────────────────
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
app.frontend.base-url=${FRONTEND_BASE_URL}

# ── Uwierzytelnianie (JWT) ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}
jwt.expiration-time-ms=${JWT_EXPIRATION_TIME_MS}
app.auth.require-email-confirmation=${AUTH_REQUIRE_EMAIL_CONFIRMATION}
app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
legacy.default-user.username=${LEGACY_DEFAULT_USERNAME}
legacy.default-user.transfer-to=${LEGACY_DEFAULT_USER_TRANSFER_TO}

# ── Mail (rejestracja) ──────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ── AI -- generowanie notatek (OpenAI przez Spring AI) ──────────────────────────────
openai.api-key=${OPENAI_API_KEY}
openai.base-url=${OPENAI_BASE_URL}
openai.model=${OPENAI_MODEL}
openai.temperature=${OPENAI_TEMPERATURE}
ai.daily-note-limit=${AI_DAILY_NOTE_LIMIT}
# Quiz z AI — domyślne wartości, gdy zmiennej nie ma w .env
ai.daily-quiz-limit=${AI_DAILY_QUIZ_LIMIT:5}
ai.quiz-max-pool=${AI_QUIZ_MAX_POOL:1000}
ai.quiz-timeout-seconds=${AI_QUIZ_TIMEOUT_SECONDS:240}
ai.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:120}

# ── Pliki na dysku ──────────────────────────────────────────────────────────────────
notes.storage.path=${NOTES_STORAGE_PATH}
attachments.storage.path=${ATTACHMENTS_STORAGE_PATH}
attachments.max-file-size-mb=${ATTACHMENTS_MAX_FILE_SIZE_MB}

# ── Logowanie ───────────────────────────────────────────────────────────────────────
debug.logging=${DEBUG_LOGGING}

# ── Backup bazy (pg_dump) ───────────────────────────────────────────────────────────
backup.enabled=${BACKUP_ENABLED}
backup.directory=${BACKUP_DIRECTORY}
backup.retention-days=${BACKUP_RETENTION_DAYS}
backup.schedule-hour=${BACKUP_SCHEDULE_HOUR}
backup.schedule-minute=${BACKUP_SCHEDULE_MINUTE}
backup.pg-dump-path=${BACKUP_PG_DUMP_PATH}
backup.pg-restore-path=${BACKUP_PG_RESTORE_PATH}
backup.restore.enabled=${BACKUP_RESTORE_ENABLED}
backup.restore.secret=${BACKUP_RESTORE_SECRET}

# ── Weryfikacja aktualnosci notatek ─────────────────────────────────────────────────
actuality.verification.enabled=${ACTUALITY_VERIFICATION_ENABLED}
actuality.verification.period=${ACTUALITY_VERIFICATION_PERIOD}
actuality.verification.cron=${ACTUALITY_VERIFICATION_CRON}
actuality.verification.zone-id=${ACTUALITY_VERIFICATION_ZONE_ID}

# ── Zbiorczy backup notatek (.kfbundle) ─────────────────────────────────────────────
note-bundle-backup.enabled=${NOTE_BUNDLE_BACKUP_ENABLED}
note-bundle-backup.directory=${NOTE_BUNDLE_BACKUP_DIRECTORY}
note-bundle-backup.cron=${NOTE_BUNDLE_BACKUP_CRON}
note-bundle-backup.zone-id=${NOTE_BUNDLE_BACKUP_ZONE_ID}

# ── Widocznosc elementow UI ─────────────────────────────────────────────────────────
ui.visible-binary-loader=${UI_VISIBLE_BINARY_LOADER}

# =====================================================================================
# Stale techniczne -- NIE konfigurowac (od nich zalezy poprawnosc dzialania aplikacji)
# =====================================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=knowledge-forge-pool
# DatabaseRestoreService zawiesza/wznawia pule na czas pg_restore
spring.datasource.hikari.allow-pool-suspension=true
# Schemat utrzymuje config.Schema -- Hibernate niczego nie tworzy ani nie zmienia
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.thymeleaf.check-template-location=false
