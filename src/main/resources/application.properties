# ===============================
# APP -- Spring Boot
# ===============================
spring.application.name=Knowledge-Forge
server.port=8081
# Lokalne sekrety (gitignorowane) -- nadpisuja wszystko ponizej. Kazdy klucz mozna tez nadpisac
# zmienna srodowiskowa wg konwencji Springa: "db.url" -> DB_URL, "jwt.secret" -> JWT_SECRET itd.
spring.config.import=optional:classpath:config-local.properties,optional:classpath:application-local.properties

# ===============================
# DATABASE - POSTGRES (Spring Data JPA / Hibernate + HikariCP)
# ===============================
db.url=jdbc:postgresql://localhost:5432/pgDB
db.username=user
db.password=password

spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=knowledge-forge-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Pozwala DatabaseRestoreService bezpiecznie zawiesic/wznowic pule na czas pg_restore.
spring.datasource.hikari.allow-pool-suspension=true

# Schemat utrzymuje config.Schema (idempotentne migracje przy kazdym starcie) -- Hibernate niczego
# nie tworzy ani nie zmienia sam.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ===============================
# CORS / BASE URL
# ===============================
cors.allowed-origin=http://localhost:3000
# Adres frontendu -- z niego budowany jest link aktywacyjny w mailu (<base-url>/confirm?token=...).
app.frontend.base-url=http://localhost:3000

# ===============================
# UWIERZYTELNIANIE (JWT)
# ===============================
# NIE trzymaj prawdziwego sekretu w repo -- ustaw JWT_SECRET (min. 32 znaki) albo wpisz go
# w application-local.properties.
jwt.secret=change-me-local-dev-secret-at-least-32-characters
jwt.issuer=knowledge-forge
jwt.expiration-time-ms=28800000
# true = logowanie wymaga potwierdzenia konta linkiem z maila (users.active=true).
# false = jak na masterze: konto dziala od razu po rejestracji, mail jest tylko informacyjny.
app.auth.require-email-confirmation=false

# Konto administratora zakladane przy starcie, jesli nie istnieje.
app.admin.username=admin
app.admin.email=admin@knowledge-forge.local
app.admin.password=Admin123!

# Jednorazowe przeniesienie danych z dawnego wspolnego konta "default" (wersja bez logowania)
# na wskazane konto. Puste = nic nie przenosi. Przyklad: legacy.default-user.transfer-to=admin
legacy.default-user.username=default
legacy.default-user.transfer-to=

# ===============================
# MAIL (rejestracja)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.thymeleaf.check-template-location=false

# ===============================
# PRZECHOWYWANIE NOTATEK
# ===============================
# Baza danych trzyma tylko sciezki do plikow -- same notatki (.kfdoc) leza na dysku pod ta sciezka.
notes.storage.path=./data/notes

# ===============================
# LOGOWANIE
# ===============================
# Szczegolowe logi (DEBUG) z pakietu aplikacji -- wylacz w prod: DEBUG_LOGGING=false
debug.logging=true

# ===============================
# ZALACZNIKI
# ===============================
attachments.storage.path=./data/attachments
attachments.max-file-size-mb=100
# Multipart: bez buforowania w pamieci (threshold 0 -> od razu na dysk), limit = max-file-size-mb.
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.max-file-size=${attachments.max-file-size-mb}MB
spring.servlet.multipart.max-request-size=101MB

# ===============================
# BACKUP BAZY POSTGRESQL (pg_dump -Fc) -- NIE obejmuje plikow z attachments.storage.path
# ===============================
backup.enabled=true
backup.directory=./data/database-backups
backup.retention-days=14
backup.schedule-hour=2
backup.schedule-minute=0
backup.pg-dump-path=pg_dump
backup.pg-restore-path=pg_restore

# ===============================
# WERYFIKACJA AKTUALNOSCI NOTATEK (zob. dokumentacja/ACTUALITY_VERIFICATION.txt)
# ===============================
actuality.verification.enabled=true
actuality.verification.period=P2Y
actuality.verification.cron=0 17 * * 5
actuality.verification.zone-id=Europe/Warsaw

# ===============================
# WIDOCZNOSC ELEMENTOW UI
# ===============================
ui.visible-binary-loader=false

# ===============================
# CODZIENNY ZBIORCZY BACKUP NOTATEK/INSTRUKCJI (.kfbundle) -- zob. dokumentacja/BACKUP_STRATEGY.txt
# ===============================
note-bundle-backup.enabled=true
note-bundle-backup.directory=./data/note-bundle-backups
note-bundle-backup.cron=30 17 * * *
note-bundle-backup.zone-id=Europe/Warsaw

# ===============================
# ADMINISTRACYJNY ENDPOINT RESTORE -- domyslnie wylaczony i zablokowany
# ===============================
# Zob. dokumentacja/BACKUP_AND_RESTORE.txt. Sekret WYLACZNIE ze zmiennej BACKUP_RESTORE_SECRET.
backup.restore.enabled=false
backup.restore.secret=
